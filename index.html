<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verox - Keyless</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #38bdf8;
            font-weight: 700;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .key-box {
            display: none;
            margin-top: 20px;
        }

        .key-input-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #38bdf8;
            font-size: 14px;
            outline: none;
            text-align: center;
            font-weight: bold;
        }

        .copy-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #059669;
        }

        .success-text {
            color: #10b981;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Verox - Keyless</h1>
        <p>Hệ thống lấy key tự động nhanh chóng và tiện lợi</p>

        <!-- Nút Get Key ban đầu -->
        <div id="get-key-section">
            <button class="btn" onclick="openGetLink()">Get Key</button>
        </div>

        <!-- Khu vực hiển thị Key sau khi vượt link -->
        <div id="key-section" class="key-box">
            <p style="margin-bottom: 5px;">Key của bạn đây:</p>
            <div class="key-input-group">
                <input type="text" id="keyOutput" readonly>
                <button class="copy-btn" onclick="copyKey()">Copy</button>
            </div>
            <div id="successMsg" class="success-text">Đã sao chép key thành công!</div>
        </div>
    </div>

    <script>
        // Hàm khi bấm nút Get Key
        function openGetLink() {
            // Đánh dấu vào localStorage rằng người dùng đã bấm lấy link
            localStorage.setItem('verox_clicked', 'true');
            // Chuyển hướng sang trang link vượt
            window.location.href = "https://link4sub.com/0uZJCyBz4P";
        }

        // Kiểm tra ngay khi trang vừa tải xong
        window.onload = function() {
            const hasClicked = localStorage.getItem('verox_clicked');

            if (hasClicked === 'true') {
                // Ẩn nút Get Key, hiện ô chứa Key
                document.getElementById('get-key-section').style.display = 'none';
                document.getElementById('key-section').style.display = 'block';

                // Tạo một key ngẫu nhiên bắt đầu bằng verox_
                const randomKey = generateVeroxKey();
                document.getElementById('keyOutput').value = randomKey;

                // Xóa trạng thái để lần sau muốn lấy key mới phải bấm lại từ đầu (tùy chọn)
                localStorage.removeItem('verox_clicked');
            }
        };

        // Hàm tạo key ngẫu nhiên có tiền tố verox_
        function generateVeroxKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = 'verox_';
            // Tạo thêm 12 ký tự ngẫu nhiên phía sau
            for (let i = 0; i < 12; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Hàm copy key vào clipboard
        function copyKey() {
            const keyInput = document.getElementById('keyOutput');
            keyInput.select();
            keyInput.setSelectionRange(0, 99999); // Dành cho thiết bị di động
            navigator.clipboard.writeText(keyInput.value);

            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 2000);
        }
    </script>
</body>
</html>
